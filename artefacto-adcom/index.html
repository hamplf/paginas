<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jessica y Joanna</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #68737d;
      --accent: #3f6b5a;
      --border: #ddd8cf;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .card {
      max-width: 720px;
      width: 100%;
      background: var(--card);
      border-radius: 18px;
      padding: 56px 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .mark {
      width: 56px;
      height: 4px;
      margin: 0 auto 32px;
      background: var(--accent);
      border-radius: 2px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.35;
    }

    h1 span {
      color: var(--accent);
    }

    .note {
      margin-top: 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .card { padding: 40px 24px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"></div>
    <h1>Que <span>Jessica y Joanna</span> vean lo que esto puede hacer.</h1>
    <p class="note">Hecho con Hermes.</p>
  </main>
</body>
</html>
